<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Halo 效果预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    padding: 20px;
  }
  .scene {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 设备外壳 */
  .device {
    position: relative;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a4a, #232330 60%, #16161f);
    box-shadow:
      0 30px 80px rgba(0,0,0,.8),
      0 0 0 6px #0d0d14,
      inset 0 2px 8px rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 灯环通用 */
  .ring {
    position: absolute;
    border-radius: 50%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  /* 第4圈 最外 - 任务④ 排队 紫色慢转 */
  .ring4 {
    width: 420px; height: 420px;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 200deg,
      rgba(170,80,255,.3) 240deg, rgba(170,80,255,.8) 330deg, #b050ff 360deg);
    -webkit-mask: radial-gradient(transparent 199px, #000 200px, #000 210px, transparent 211px);
            mask: radial-gradient(transparent 199px, #000 200px, #000 210px, transparent 211px);
    animation: spin 5s linear infinite reverse;
    filter: drop-shadow(0 0 8px rgba(170,80,255,.7));
  }
  /* 第3圈 - 任务③ 刚刚完成 绿色常亮 */
  .ring3 {
    width: 360px; height: 360px;
    border: 11px solid rgba(40,200,90,.9);
    filter: drop-shadow(0 0 10px rgba(40,200,90,.6));
  }
  /* 第2圈 - 任务② 等待确认 橙色呼吸 */
  .ring2 {
    width: 300px; height: 300px;
    border: 11px solid rgba(255,140,0,.9);
    border-top-color: #ff8c00;
    border-right-color: rgba(255,140,0,.2);
    animation: breathe 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,140,0,.6));
  }
  /* 第1圈 最内 - 任务① 执行中 黄色追逐 */
  .ring1 {
    width: 240px; height: 240px;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 240deg,
      rgba(255,200,0,.25) 280deg, rgba(255,180,0,.7) 340deg,
      #ffd700 360deg);
    -webkit-mask: radial-gradient(transparent 109px, #000 110px, #000 120px, transparent 121px);
            mask: radial-gradient(transparent 109px, #000 110px, #000 120px, transparent 121px);
    animation: spin 2.2s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,200,0,.7));
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes breathe {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }
  /* 中央 AMOLED 屏 */
  .screen {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: #000;
    box-shadow: inset 0 0 0 3px #0a0a12, inset 0 0 30px #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .screen .title { font-size: 13px; color: #9ab; letter-spacing: 1px; margin-bottom: 6px; }
  .screen .task  { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .screen .status{ font-size: 12px; color: #4ade80; }
  .screen .time  { font-size: 11px; color: #567; margin-top: 8px; font-variant-numeric: tabular-nums; }
  /* 表冠旋钮 */
  .knob {
    position: absolute;
    right: 32px;
    bottom: 92px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a4a5a, #22222c 70%);
    box-shadow:
      0 4px 10px rgba(0,0,0,.7),
      inset 0 2px 4px rgba(255,255,255,.15),
      inset 0 -3px 6px rgba(0,0,0,.6);
    border: 2px solid #101018;
  }
  .knob::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: repeating-conic-gradient(#33333f 0deg 12deg, #1a1a22 12deg 24deg);
  }
  /* USB-C 口 */
  .usb {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 12px;
    border-radius: 6px;
    background: #0a0a10;
    box-shadow: inset 0 1px 3px rgba(255,255,255,.1), 0 1px 2px rgba(0,0,0,.8);
  }
  /* 标注 */
  .label {
    position: absolute;
    font-size: 12px;
    color: #8899aa;
    background: rgba(20,26,40,.85);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #2a3550;
    white-space: nowrap;
  }
  .l1 { left: -190px; top: 90px; }
  .l2 { left: -200px; top: 200px; }
  .l3 { left: -190px; top: 320px; }
  .l4 { right: -205px; top: 120px; }
  .l5 { right: -190px; bottom: 130px; }
  .l6 { left: 50%; transform: translateX(-50%); bottom: -30px; }
  .caption {
    margin-top: 46px;
    color: #aabbdd;
    font-size: 14px;
    text-align: center;
    line-height: 1.7;
  }
  .caption b { color: #ffd76a; }
</style>
</head>
<body>
  <div class="scene">
    <div class="device">
      <div class="ring ring4"></div>
      <div class="ring ring3"></div>
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <div class="screen">
        <div class="title">CODEX HALO</div>
        <div class="task">任务③ 代码重构</div>
        <div class="status">● 已完成</div>
        <div class="time">运行 00:12:47</div>
      </div>
      <div class="knob"></div>
      <div class="usb"></div>
    </div>
    <div class="label l1">④ 排队等待 · 紫色慢转</div>
    <div class="label l2">③ 已完成 · 绿色常亮</div>
    <div class="label l3">② 等待确认 · 橙色呼吸</div>
    <div class="label l4">① 执行中 · 黄色追逐</div>
    <div class="label l5">表冠旋钮<br>转=选圈 / 按=切屏</div>
    <div class="label l6">USB-C 一线连（供电+数据）</div>
  </div>
  <div class="caption">
    <b>Codex Halo</b> · 直径约 180mm · 四圈 RGB + 中央 AMOLED 屏<br>
    四个 AI 任务状态一眼看全，不用切窗口
  </div>
</body>
</html>
